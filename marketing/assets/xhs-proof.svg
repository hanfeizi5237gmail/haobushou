  <g transform="translate(72 990)">
    <rect width="936" height="250" rx="30" fill="#dbeef3"/>
    <text x="42" y="64" font-family="Hiragino Sans GB, sans-serif" font-size="29" font-weight="800" fill="#164862">为什么不是“98 篇全成功”？</text>
    <text x="42" y="116" font-family="Hiragino Sans GB, sans-serif" font-size="25" fill="#3d5f70">发现、去重、正文归档、失败和待处理是不同口径。</text>
    <text x="42" y="160" font-family="Hiragino Sans GB, sans-serif" font-size="25" fill="#3d5f70">号捕手保留真实状态，不把暂停和失败包装成成功。</text>
    <text x="42" y="211" font-family="Hiragino Sans GB, sans-serif" font-size="23" fill="#657482">单次试点快照，不代表普遍容量、速度或成功率。</text>
