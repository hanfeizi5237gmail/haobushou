  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f4ec"/><stop offset="1" stop-color="#e8f2f3"/></linearGradient></defs>
  <rect width="1080" height="1440" fill="url(#bg)"/>
  <circle cx="1000" cy="120" r="260" fill="#badfec" opacity=".45"/><circle cx="-10" cy="1340" r="260" fill="#efd888" opacity=".25"/>
  <text x="72" y="105" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="24" letter-spacing="4" fill="#52687b">号捕手 · 真实任务快照</text>
  <text x="72" y="224" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="67" font-weight="800" fill="#142238">不只说能同步，</text>
  <text x="72" y="310" font-family="Hiragino Sans GB, Heiti SC, sans-serif" font-size="67" font-weight="800" fill="#1f62d3">把过程数字摊开看</text>
  <text x="75" y="372" font-family="Hiragino Sans GB, sans-serif" font-size="27" fill="#536579">一次 WeRead 历史同步试点 · 2026-09-02</text>
  <g transform="translate(72 470)">
    <rect width="936" height="190" rx="30" fill="#142238"/><text x="52" y="62" font-family="Hiragino Sans GB, sans-serif" font-size="25" fill="#abc6d8">发现列表候选</text><text x="52" y="142" font-family="Hiragino Sans GB, sans-serif" font-size="76" font-weight="800" fill="#fff">98</text><text x="257" y="126" font-family="Hiragino Sans GB, sans-serif" font-size="34" fill="#f2d475">→</text><text x="324" y="62" font-family="Hiragino Sans GB, sans-serif" font-size="25" fill="#abc6d8">去重后排队</text><text x="324" y="142" font-family="Hiragino Sans GB, sans-serif" font-size="76" font-weight="800" fill="#fff">94</text><text x="529" y="126" font-family="Hiragino Sans GB, sans-serif" font-size="34" fill="#f2d475">→</text><text x="596" y="62" font-family="Hiragino Sans GB, sans-serif" font-size="25" fill="#abc6d8">本地归档工件</text><text x="596" y="142" font-family="Hiragino Sans GB, sans-serif" font-size="76" font-weight="800" fill="#f2d475">54</text>
  </g>
  <g transform="translate(72 710)">
    <rect width="448" height="210" rx="30" fill="#fff" stroke="#d9e0e5"/><text x="40" y="65" font-family="Hiragino Sans GB, sans-serif" font-size="26" fill="#657482">明确失败</text><text x="40" y="150" font-family="Hiragino Sans GB, sans-serif" font-size="72" font-weight="800" fill="#cf3f4e">1</text><text x="148" y="143" font-family="Hiragino Sans GB, sans-serif" font-size="27" fill="#657482">篇，可重抓</text>
    <rect x="488" width="448" height="210" rx="30" fill="#fff" stroke="#d9e0e5"/><text x="528" y="65" font-family="Hiragino Sans GB, sans-serif" font-size="26" fill="#657482">暂停后待处理</text><text x="528" y="150" font-family="Hiragino Sans GB, sans-serif" font-size="72" font-weight="800" fill="#1f62d3">39</text><text x="666" y="143" font-family="Hiragino Sans GB, sans-serif" font-size="27" fill="#657482">篇，进度保留</text>
