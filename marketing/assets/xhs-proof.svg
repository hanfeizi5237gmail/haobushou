  <rect x="72" y="1305" width="936" height="68" rx="34" fill="#f1d575"/><text x="540" y="1350" text-anchor="middle" font-family="Hiragino Sans GB, sans-serif" font-size="28" font-weight="800" fill="#172238">任务可暂停 · 可恢复 · 失败可见</text>
